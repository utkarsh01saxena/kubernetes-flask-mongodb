apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-config
  namespace: flask-mongo-app
  labels:
    app.kubernetes.io/name: flask-app
    app.kubernetes.io/component: backend
data:
  FLASK_ENV: "production"
  PORT: "5000"
  MONGO_HOST: "mongo-service"
  MONGO_PORT: "27017"
  MONGO_DB: "flask_db"
  MONGO_AUTH_SOURCE: "admin"
